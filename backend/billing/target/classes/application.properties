# Server Configuration
server.port=8080

# Spring Application
spring.application.name=billing

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/supermarket_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=9a67c50a12e2e7b0a7246473de0ffbb4ef0c2834b9d1234909a8bcde2940283f
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.market.billing=INFO
logging.level.org.springframework.security=WARN
